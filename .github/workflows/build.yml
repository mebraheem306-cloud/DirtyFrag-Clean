name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses >/dev/null 2>&1 || true
      - name: Build Release APK
        run: chmod +x gradlew && ./gradlew :app:assembleRelease
      - name: Locate generated APK
        run: find app/build/outputs/apk/release -type f -name "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dirtyfrag-apk
          path: app/build/outputs/apk/release/*.apk
